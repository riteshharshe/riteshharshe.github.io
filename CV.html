    <style>

        main{

                text-decoration:none;
                font-weight:600;
            }

            .navbar ul{

                margin:25px auto;
                padding:0 16px;
            }

            .ext_links ul{
                gap:12px 18px;
            }

        }

        /* Small phones (< 480px) */
        @media (max-width:480px){

            }

            .navbar ul{
